version: "3.7"
services:

  nutriplan-pro:
    image: nutriplan-pro
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - typebotnet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=typebotnet"
        - "traefik.http.routers.nutriplan-pro.rule=Host(`nutriplanpro.automatech.tech`)"
        - "traefik.http.routers.nutriplan-pro.entrypoints=websecure"
        - "traefik.http.routers.nutriplan-pro.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.nutriplan-pro.service=nutriplan-pro"
        - "traefik.http.services.nutriplan-pro.loadbalancer.server.port=80"

networks:
  typebotnet:
    external: true
    name: typebotnet
