version: "3.7"
services:

  app:
    image: nutriplan-pro
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    networks:
      - typebotnet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=typebotnet"
        - "traefik.http.routers.nutri.rule=Host(`nutriplanpro.automatech.tech`)"
        - "traefik.http.routers.nutri.entrypoints=web"
        - "traefik.http.routers.nutri.service=nutri"
        - "traefik.http.services.nutri.loadbalancer.server.port=80"

networks:
  typebotnet:
    external: true
    name: typebotnet
