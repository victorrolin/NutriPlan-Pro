version: "3.7"
services:

  trainer-app:
    image: trainer-app
    build: .
    networks:
      - typebotnet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        ## fitplanpro.automatech.tech
        - traefik.http.routers.trainer-app.rule=Host(`fitplanpro.automatech.tech`)
        - traefik.http.routers.trainer-app.entrypoints=websecure
        - traefik.http.routers.trainer-app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.trainer-app.service=trainer-app
        - traefik.http.services.trainer-app.loadbalancer.server.port=80

networks:
  typebotnet:
    external: true
    name: typebotnet
